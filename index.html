<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PNW RoadWatch - Home</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <link rel="stylesheet" href="code/map/roadwatch-map.css">
        <link rel="stylesheet" href="code/map/directions.css">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
        <!-- Order matters: deferred scripts run in this order, and each needs the one before it -->
        <script src="code/map/roadwatch-map.js" defer></script>
        <script src="code/map/roadwatch-directions.js" defer></script>
        <script src="main.js" defer></script>

        <!-- google maps api for location autocomplete from https://developers.google.com/maps/documentation/javascript/place-autocomplete-new#maps_place_autocomplete_element-javascript -->
        <script>
            // prettier-ignore
            (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
                key: "AIzaSyDJfwMxdOKWXqU8RbUP6HRATD5gmhTfuGQ"
            });
        </script>
    </head>

    <body>
        <div class="bodyContents" id="homeBodyContents">

            <div class="header">
                <div id="headerTitle">
                    <h1>PNW RoadWatch</h1>
                    <h3>Your one-stop weather alert page for Washington, Oregon, and Idaho!</h3>

                </div>
            </div>

            <div class="mainContents" id="homeMainContents">
                <div class="map" id="mapViewContainer">
                    <!-- INSERT MAP HERE -->

                </div>

                <div id="directionsServiceContainer">
                    <h2>Get Directions</h2>

                    <!-- This was a <form>; it's a <div> now so the page doesn't reload when the button
                         (or Enter in an autocomplete box) is used. -->
                    <div id="directionsForm">
                        <!-- TODO: have checker for location search -> if not WA, OR, or ID, display a warning -->
                        <label for="startLocation">Input Starting Location:</label>
                        <div id="startLocationContainer">
                        </div><br>

                        <label for="destination">Input Destination:</label>
                        <div id="destinationContainer">
                        </div><br>

                        <button type="button" id="getDirectionsBtn">Get Route</button>
                        <button type="button" id="clearDirectionsBtn">Clear</button>
                    </div>

                    <!-- Route summary, alerts along the route, and step-by-step directions appear here -->
                    <div id="directionsPanel" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </body>
</html>
